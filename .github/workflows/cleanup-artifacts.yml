name: Cleanup Artifacts

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep only most recent artifact per name
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Group artifacts by name
            const byName = {};
            for (const a of artifacts) {
              if (!byName[a.name]) byName[a.name] = [];
              byName[a.name].push(a);
            }

            // Sort each group newest-first, delete all but the first
            for (const [name, list] of Object.entries(byName)) {
              list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of list.slice(1)) {
                console.log(`Deleting artifact: ${artifact.name} (id: ${artifact.id}, created: ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
