name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python and project dependencies
        run: uv sync --group dev

      - name: Build .app with PyInstaller
        run: uv run pyinstaller pyexamscan.spec

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "PyExamScan" \
            --window-size 600 400 \
            --icon-size 128 \
            --app-drop-link 450 185 \
            "PyExamScan-macOS.dmg" \
            "dist/PyExamScan.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyExamScan-macOS
          path: PyExamScan-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python and project dependencies
        run: uv sync --group dev

      - name: Build .exe with PyInstaller
        run: uv run pyinstaller pyexamscan.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyExamScan-Windows
          path: dist\PyExamScan\PyExamScan.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PyExamScan-macOS/PyExamScan-macOS.dmg
            PyExamScan-Windows/PyExamScan.exe
          generate_release_notes: true
