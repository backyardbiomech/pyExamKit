name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, and a shallow
          # clone may not carry enough history for it to resolve one.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install Python and project dependencies
        run: uv sync --group dev

      - name: Build .app with PyInstaller
        run: uv run pyinstaller pyexamkit.spec

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "PyExamKit" \
            --window-size 600 400 \
            --icon-size 128 \
            --app-drop-link 450 185 \
            "PyExamKit-macOS.dmg" \
            "dist/PyExamKit.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: PyExamKit-macOS
          path: PyExamKit-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, and a shallow
          # clone may not carry enough history for it to resolve one.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install Python and project dependencies
        run: uv sync --group dev

      - name: Build .exe with PyInstaller
        run: uv run pyinstaller pyexamkit.spec

      - name: Zip Windows build
        run: Compress-Archive -Path dist\PyExamKit\* -DestinationPath PyExamKit-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: PyExamKit-Windows
          path: PyExamKit-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            PyExamKit-macOS/PyExamKit-macOS.dmg
            PyExamKit-Windows/PyExamKit-Windows.zip
          generate_release_notes: true

      - name: Delete artifacts after release
        uses: actions/github-script@v9
        with:
          script: |
            const names = ['PyExamKit-macOS', 'PyExamKit-Windows'];
            for (const name of names) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                per_page: 100,
              });
              for (const artifact of data.artifacts) {
                console.log(`Deleting artifact: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
