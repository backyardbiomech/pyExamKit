[project]
name = "pyexamscan"
version = "3.0.2"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.24",
    "fpdf2>=2.7",
    "customtkinter>=5.2",
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "jinja2>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.5",
]
