[project]
name = "pyexamscan"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pymupdf>=1.24",
    "fpdf2>=2.7",
    "customtkinter>=5.2",
    "pytesseract>=0.3.10",
    "pyobjc-framework-vision>=12.1",
    "pyobjc-framework-quartz>=12.1",
    "transformers>=5.4.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.5",
]
